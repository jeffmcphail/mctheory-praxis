[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "mctheory-praxis"
version = "0.1.0"
description = "McTheory Praxis -- Universal Trading Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jeff"}
]

# PINNING POLICY (Cycle 65)
# -------------------------
# Runtime dependencies carry a lower bound plus a major-version cap:
# ">=X.Y,<MAJOR+1". Patch and minor upgrades stay routine; a breaking major
# cannot arrive unannounced. Test tooling is pinned harder -- to the minor --
# because two machines collecting different test counts is precisely the
# failure this cycle exists to remove. See [project.optional-dependencies].dev.
dependencies = [
    "duckdb>=1.0.0,<2",
    "numpy>=1.26.0,<3",
    "pandas>=2.0.0,<3",
    "polars>=1.0.0,<2",
    "pyarrow>=14.0.0,<22",
    "xxhash>=3.0.0,<4",
    "pydantic>=2.0.0,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.4.0,<2",
    "statsmodels>=0.14.0,<1",
    "scipy>=1.12.0,<2",
    # --- Cycle 65: previously undeclared, but imported by SCHEDULED collectors.
    # Their absence is why a clean install of Praxis was broken: MCRMINI2 was
    # not a new problem, it was the first machine to report an old one.
    # requests      -- 51 import sites, 36 module-level; crypto_data_collector,
    #                  live_collector, smart_money
    # python-dotenv -- 51 sites, 43 module-level; load_dotenv() before reading
    #                  any key is a standing Praxis rule, so this is a hard
    #                  RUNTIME dependency, not a test one
    # websockets    -- liquidation_collector + bybit_liquidation_collector
    # joblib        -- funding_monitor loads its models with it
    "requests>=2.31.0,<3",
    "python-dotenv>=1.0.0,<2",
    "websockets>=12.0,<16",
    "joblib>=1.3.0,<2",
]

[project.optional-dependencies]
# Test tooling is pinned to the MINOR, not just the major. The MCRMINI1/MCRMINI2
# divergence included pytest 9.0.3 vs 9.1.1, and a minor bump is exactly the kind
# of change that can alter collection. Measured caveat, recorded so the pin is not
# mistaken for a fix: the observed 1425-vs-1418 gap was NOT caused by pytest or by
# the plugin set -- it was the missing python-dotenv (see the Cycle 65 retro, T3).
# This pin is precautionary reproducibility, not the remedy for that symptom.
dev = [
    "pytest>=9.1,<9.2",
    "pytest-cov>=7.0,<8",
    "ruff>=0.5.0,<1",
]
data = [
    "yfinance>=0.2.0,<1",
    "ccxt>=4.2.25,<5",
]
mcp = [
    "mcp>=1.2.0,<2",
]
onchain = [
    "web3>=6.15.0,<8",
    "py-clob-client>=0.17.0,<1",
    # eth_account is imported directly by engines/market_maker.py rather than
    # being relied on transitively through web3.
    "eth-account>=0.13.0,<1",
]
# Cycle 65: groups below cover imports that were undeclared but are all LAZY
# (function-level or try-guarded), so their absence degrades a feature rather
# than breaking a collector. None of torch/xgboost/arch/psycopg2 are even
# installed on MCRMINI1 today, which is consistent with them being genuinely
# optional paths that are not exercised.
ml = [
    "torch>=2.2.0,<3",
    "xgboost>=2.0.0,<4",
    "arch>=6.3.0,<8",
]
ai = [
    "openai>=1.30.0,<3",
    "anthropic>=0.40.0,<1",
]
viz = [
    "matplotlib>=3.8.0,<4",
]
# src/praxis/live/__init__.py imports psycopg2 inside a try and raises a message
# telling the operator to "pip install psycopg2-binary". Declared here so that
# advice is satisfiable from the manifest rather than from memory.
postgres = [
    "psycopg2-binary>=2.9.0,<3",
]
backend = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]
dashboard = [
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
